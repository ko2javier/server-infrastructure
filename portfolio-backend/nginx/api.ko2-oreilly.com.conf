server {
    listen 80;
    server_name api.ko2-oreilly.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.ko2-oreilly.com;

    ssl_certificate /etc/ssl/certs/ko2.crt;
    ssl_certificate_key /etc/ssl/private/ko2.key;

    location / {
        # 127.0.0.1 y no localhost (2026-10-18): el gateway solo escucha en
        # 127.0.0.1 desde ese dia, y localhost tambien resuelve a ::1. nginx
        # probaba primero ::1, le rechazaban y reintentaba: funcionaba, pero
        # con un intento fallido y una linea de error cada pocas peticiones.
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /grafana/ {
        # 127.0.0.1 y no localhost (2026-10-25), por lo mismo que el 7000 un
        # poco mas arriba: Grafana solo escucha en 127.0.0.1 desde ese dia.
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
