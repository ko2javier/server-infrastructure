services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: ko2-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ko2-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-currency-data-hub
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  api-service:
    build:
      context: ./currency-data-hub
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy

  gateway:
    # Desde el 2026-10-18 la imagen la construye GitHub Actions y se baja de
    # ghcr.io, en vez de compilarla aqui: un `gradle bootJar` dentro del VPS
    # tardaba tres minutos y medio y se comia la RAM, que es el limite de esta
    # maquina. GATEWAY_TAG lo pone el workflow con el SHA del commit, asi que
    # el contenedor dice exactamente que codigo corre y volver atras es
    # repetir el despliegue con el SHA anterior.
    image: ghcr.io/ko2javier/api-gateway-currency-data-hub:${GATEWAY_TAG:-latest}
    # El build se queda como respaldo, NO como el camino normal. Mientras
    # esten los dos, `docker compose build gateway` sigue funcionando y
    # etiqueta el resultado con el nombre de arriba, asi que el servicio se
    # puede levantar aqui si ghcr.io no responde. Quitarlo es seguro una vez
    # que el despliegue por imagen lleve un tiempo rodando.
    build:
      context: ./api-gateway-currency-data-hub
    ports:
      - "7000:7000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      api-service:
        condition: service_started
      redis:
        condition: service_healthy

  ko2-kafka-events:
    build:
      context: ./ko2-kafka-events
    ports:
      - "6000:6000"
      - "6001:6001"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - auth-service
      - api-service
      - gateway

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://api.ko2-oreilly.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:
