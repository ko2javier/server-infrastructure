global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:4000']
        labels:
          service: 'auth-service'
          environment: 'production'

  - job_name: 'api-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-service:5000']
        labels:
          service: 'api-service'
          environment: 'production'

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:7000']
        labels:
          service: 'gateway'
          environment: 'production'

  - job_name: 'ko2-kafka-events'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ko2-kafka-events:6001']
        labels:
          service: 'ko2-kafka-events'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'llm-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Por el nombre del contenedor en la red de compose, como los demas jobs
      # (2026-10-25). Antes era host.docker.internal:8085, que resolvia a la IP
      # del puente docker0: dejo de funcionar al publicar ese contenedor solo en
      # 127.0.0.1. El contenedor llm-gateway no lo levanta este compose, asi que
      # esta unido a la red a mano (docker network connect).
      - targets: ['llm-gateway:8085']
        labels:
          service: 'llm-gateway'
          environment: 'production'
